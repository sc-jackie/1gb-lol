# Deploy settings for Cursorio's NEW Railway project (EVE-435).
# Origin is the source. Do not invent a GitHub mirror.
# Custom domains 1gb.lol + www.1gb.lol are attached on that project, not here.

[build]
builder = "NIXPACKS"
buildCommand = "npm ci && npm run build"

[deploy]
startCommand = "npm start"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
